services:
  db:
    image: postgres:latest
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: sso
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5430:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data/pgdata
    networks:
      - local

  server:
    build:
      context: ./internal/sso
      dockerfile: dev.Dockerfile
    volumes:
      - ./internal/sso/:/app
      - ./internal/common/:/common
    ports:
      - "8080:8080"
    entrypoint: ./entrypoint.sh
    environment:
      JWT_SECRET_TOKEN: test_secret
    networks:
      - local

networks:
  local:
    name: local

volumes:
  pgdata:
    driver: local